# Rules for t_osa_hourly on every platform.
# OSA crawls search many product codes in one query; codes absent from the
# results are recorded Out of Stock with null fields -> nulls are EXPECTED
# there, so most row rules are guarded with `when: stock_status == 'In Stock'`.
# when: first apply, filter data. check: after "when" it apply to check further condition these should be positive or good condition because code will reverse it
dataset: t_osa_hourly
crawl_key: [date_stamp, hour_stamp]
# ['time_stamp', 'platform_id', 'platform', 'platform_code', 'rating',
#       'num_of_rating', 'mrp', 'sp', 'seller', 'stock_status',
#       'rating_distribution', 'customer_review', 'additional_data',
#       'delivery_time', 'delivery_days', 'deal', 'tag', 'date_stamp',
#       'hour_stamp', 'pincode']
rules:
  - id: platform_constant
    column: platform
    check: constant
    params: {value: "{{ platform }}"}
    scope: row
    severity: error
    on_fail: report_only
    description: >
      The platform column should always equal the platform this file is
      configured for. Any other value means rows from a different platform
      leaked into this dataset/file.

#   - id: timestamp_present
#     column: time_stamp
#     check: not_null
#     scope: row
#     severity: warn
#     on_fail: report_only
#     description: >
#       Every row must carry a crawl time_stamp. A missing time_stamp means
#       the row can't be placed in the hourly cycle it belongs to.

  - id: code_present
    column: platform_code
    check: not_null
    scope: row
    severity: error
    on_fail: investigate
    description: >
      Every row must have a platform_code, since OSA crawls are keyed off
      a known list of product codes. A null here means the code itself
      failed to extract, not that stock is unavailable.

  - id: stock_status_valid
    column: stock_status
    check: allowed_values
    params: {values: ["In Stock", "Out of Stock", "Currently unavailable"]}
    scope: row
    severity: error
    on_fail: investigate
    description: >
      stock_status must be one of the three known values and similar.

# In-stock rows must carry commercial data
  - id: sp_null_when_instock
    column: sp
    check: not_null
    when: "stock_status == 'In Stock'"
    scope: row
    severity: error
    on_fail: investigate
    description: >
      An In Stock product is listed for sale and must show a selling
      price. A null sp on an In Stock row means the price xpath failed
      to extract, not that the price is genuinely absent.

  - id: sp_positive
    column: sp
    check: range
    params: {min: 1}
    when: "stock_status == 'In Stock'"
    scope: row
    severity: error
    on_fail: investigate
    description: >
      Selling price on an In Stock row must be at least 1. A zero or
      negative value points to a broken price extraction rather than a
      real price.

  - id: sp_not_above_mrp
    column: sp
    check: compare
    params: {expr: "sp <= mrp"}
    when: "sp is not null and mrp is not null"
    scope: row
    severity: error
    on_fail: investigate
    description: >
      Selling price should never exceed MRP when both are present. 

  - id: rating_bounds
    column: rating
    check: range
    params: {min: 1, max: 5}
    scope: row
    severity: error
    on_fail: investigate
    description: >
      Rating must fall within the valid 1-5 star scale.

  - id: delivery_days_sane
    column: delivery_days
    check: range
    params: {min: 0, max: 60}
    scope: row
    severity: warn
    on_fail: report_only
    description: >
      Delivery days should fall within a realistic 0-60 day window.
# A crawl that is mostly Out of Stock smells like a blocked/captcha page,
# not real availability -> AI verifies against the raw HTML.
