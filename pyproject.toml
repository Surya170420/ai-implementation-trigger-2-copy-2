[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infytrix-ai-toolkit"
version = "0.1.0"
description = "Reusable AI components (LLM client, structured output, prompts, checks engine) shared across automation projects"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.40",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "lxml>=4.9",
    "requests>=2.31",
    "pip>=26.1.2",
    "google-auth-oauthlib>=1.4.0",
    "google-api-python-client",
    "ollama>=0.4",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "langchain>=1.3.14",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-anthropic>=1.5.0",
    "common-utils-repository",
    "langchain-openai>=1.4.0",
    "langchain-mcp-adapters>=0.3.0",
]

[tool.setuptools.packages.find]
include = ["ai_toolkit*"]

[tool.uv.sources]
common-utils-repository = { git = "https://github.com/Infytrix-Ecom/common-utils-repo.git" }
